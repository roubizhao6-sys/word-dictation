<style>
:root{
  --orange:#ff7a45; --orange-d:#f2653a; --orange-l:#fff1ea;
  --tx:#2b2b2b; --tx2:#5e5e5e; --tx3:#8d8d8d;
  --line:#e8e8e8; --bg:#ffffff; --bg2:#fafafa; --bg3:#f5f5f5;
  --wrong:#ec6a5e; --ok:#2b2b2b; --green:#3bbf7c;
  --shadow:0 6px 24px rgba(0,0,0,.10);
  --radius:14px;
}
html[data-theme="dark"]{
  --tx:#e8e8e8; --tx2:#9a9a9a; --tx3:#6b6b6b;
  --line:#2e2e2e; --bg:#141414; --bg2:#1c1c1c; --bg3:#242424;
  --orange-l:#3a2419; --wrong:#f0736a; --ok:#e8e8e8;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--tx);overflow:hidden;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none !important}
.screen{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- 通用元件 ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--tx2)}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--orange)} .sw.on i{left:21px}
html[data-theme="dark"] .sw i{background:#e8e8e8}
.rowset{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.rowset:last-child{border-bottom:none}
.rowset .lb{font-size:15px}
.rowset .sub{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.5}
select,input[type=text]{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:6px 10px;font-size:14px;outline:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--orange);color:#fff}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:32px;font-size:17px;color:var(--tx2)}
.stepper input{width:64px;text-align:center;border:none;background:transparent;color:var(--tx);font-size:14px}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 14px;font-size:14px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:12px;font-weight:600}
.icobtn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2)}
.icobtn:hover{background:var(--bg3)}

/* ---------- 顶部浮动头部（听写页） ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:2px;flex-wrap:nowrap;
  background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 8px 6px;
  width:100%;max-width:none;overflow-x:auto;scrollbar-width:none}
#hdr::-webkit-scrollbar{display:none}
#scDrill{padding-top:calc(48px + env(safe-area-inset-top))}
#hdr .chap{font-size:13px;padding:0 8px;border-right:1px solid var(--line);margin-right:4px;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#hdr .textbtn{font-size:14px;color:var(--tx);padding:8px 10px;white-space:nowrap;font-weight:600;flex:0 0 auto;min-height:40px}
#hdr .mode{font-size:13px;color:var(--orange);padding:8px;border-radius:8px;display:flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0}
#hdr .mode span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr .mode:hover{background:var(--orange-l)}
#hdr svg{width:17px;height:17px;fill:currentColor}

/* ---------- 章节/首页 ---------- */
.page{max-width:900px;margin:0 auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom))}
#scHome,#scResult{padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg);z-index:10;flex-wrap:wrap}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:9;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto}
.tabs button{padding:11px 0;font-size:14px;color:var(--tx2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--orange);font-weight:600}
.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.chapcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--bg2);text-align:left;transition:.15s}
.chapcard:hover{border-color:var(--orange);transform:translateY(-1px)}
.chapcard .n{font-size:16px;font-weight:600}
.chapcard .c{font-size:12px;color:var(--tx2);margin-top:4px}
.chapcard .pg{height:4px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.chapcard .pg i{display:block;height:100%;background:var(--orange)}
.bookbox{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px;display:flex;gap:14px;align-items:center}
.bookacts{display:flex;gap:8px;flex-wrap:wrap}
.bookacts .btn{min-height:42px}
.modechips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.modechips::-webkit-scrollbar{display:none}
.modechips button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--tx2);background:var(--bg);min-height:36px}
.modechips button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.bookbox .emoji{width:52px;height:52px;border-radius:12px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:26px}

/* ---------- 听写页 ---------- */
#drill{display:flex;flex-direction:column;height:100%;min-height:0}
#drillTop{min-height:72px;padding:8px 18px 0;display:flex;gap:14px;align-items:flex-start}
#backBtn{font-size:22px;color:var(--tx2);width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
#backBtn:hover{color:var(--tx)}
#ansBox{flex:1;min-width:0}
#ansWord{font-size:27px;font-weight:600;letter-spacing:.4px;line-height:1.25;word-break:break-word}
#ansWord.wrong{color:var(--wrong)}
#ansWord.right{color:var(--tx)}
#ansIpa{font-size:14px;color:var(--tx2);margin-top:1px}
#ansMean{font-size:13.5px;color:var(--tx2);margin-top:1px}
#ansEx{font-size:13px;color:var(--tx2);margin-top:4px;line-height:1.5}
#ansEx b{color:var(--orange);font-weight:600}
#counter{font-size:13px;color:var(--tx2);padding-top:8px;white-space:nowrap}
#drillMid{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 18px 12px;gap:16px}
@media (min-height:760px){#drillMid{justify-content:center}}
#typeWrap{position:relative;display:flex;flex-direction:column;align-items:center;min-width:150px}
#mirror{position:absolute;visibility:hidden;white-space:pre;font-size:26px;font-weight:600;letter-spacing:1px;padding:0 12px}
#typeIn{width:100%;min-width:150px;text-align:center;border:none;background:transparent;outline:none;
  font-size:26px;font-weight:600;letter-spacing:1px;color:var(--tx);padding:2px 12px}
#typeIn::placeholder{color:var(--tx3);font-size:16px;font-weight:500;letter-spacing:0}
#rule{height:1.5px;background:var(--tx3);width:100%;transition:width .12s}
#submitBtn{margin-top:16px;min-width:132px;min-height:44px}
#imeHint{margin-top:8px;text-align:center}
#speakRow{display:flex;flex-direction:column;align-items:center;gap:8px}
#spkBtn{width:64px;height:64px;border-radius:50%;background:var(--orange-l);color:var(--orange);display:flex;align-items:center;justify-content:center}
#spkBtn:hover{color:var(--orange-d)}
#voiceHint{text-align:center}
#drillBottom{padding:0 0 calc(14px + env(safe-area-inset-bottom))}
#bar{height:4px;background:var(--bg3)}
#bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .2s}
#bottomRow{display:flex;justify-content:flex-end;padding:8px 16px 0;font-size:13px;color:var(--tx2)}
#qBox{text-align:center}
.qword{font-size:34px;font-weight:600;letter-spacing:.5px}
.qipa{font-size:15px;color:var(--tx2);margin-top:2px}
.qmean{font-size:22px;color:var(--tx);line-height:1.4}
.qex{font-size:13.5px;color:var(--tx2);margin-top:6px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;background:var(--bg)}
.opt .num{width:20px;height:20px;border-radius:5px;background:var(--bg3);color:var(--tx2);font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.opt:hover{border-color:var(--orange)}
.opt.right{border-color:var(--green);background:rgba(59,191,124,.08)}
.opt.wrong{border-color:var(--wrong);background:rgba(236,106,94,.08)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8f7ee;color:#1a7f4b;border:1px solid #b9e6cd;
  border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:60;box-shadow:var(--shadow);
  max-width:calc(100vw - 24px);pointer-events:none}
html[data-theme="dark"] #toast{background:#16281f;color:#7fd7a6;border-color:#24503a}
#toast button{color:inherit;opacity:.7;font-size:15px;pointer-events:auto}

/* ---------- 抽屉 / 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:660px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:0 0 auto}
.sheet .sh h3{margin:0;font-size:17px;font-weight:600}
.sheet .body{overflow:auto;padding:0 18px 24px;flex:1}
.sheet .ft{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex:0 0 auto}
.tabrow{display:flex;gap:16px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line)}
.tabrow button{padding:10px 0;font-size:13.5px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap}
.tabrow button.on{color:var(--tx);border-color:var(--orange);font-weight:600}
/* 单词卡 */
.wcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:13px;position:relative;background:var(--bg)}
.wcard .w{font-size:22px;font-weight:600;color:var(--orange)}
.wcard .w.q{color:var(--tx)}
.wcard .i{font-size:13.5px;color:var(--tx2)}
.wcard .m{font-size:14px;margin-top:2px}
.wcard .tools{position:absolute;right:10px;top:12px;display:flex;flex-direction:column;gap:6px}
.wcard .tools button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.wcard .tools button:hover{border-color:var(--orange);color:var(--orange)}
.wcard .tools button.on{color:var(--orange);border-color:var(--orange)}
.wcard .syn{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.9}
.wcard .tabsm{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--tx2);border-bottom:1px solid var(--line);padding-bottom:2px}
.wcard .tabsm button{padding:2px 0;color:var(--tx2);border-bottom:2px solid transparent;font-size:12.5px}
.wcard .tabsm button.on{color:var(--orange);border-color:var(--orange)}
.wcard .ex{margin-top:8px;font-size:13.5px;line-height:1.7}
.wcard .ex .cn{color:var(--tx2);font-size:12.5px}
.hl{color:var(--orange);font-weight:600}
/* 设置 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow .t{font-size:14.5px}
.setrow .d{font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.5}
.kbd{font-size:12px;color:var(--tx2);background:var(--bg3);border-radius:6px;padding:2px 8px;white-space:nowrap}
.wlbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 2px}
.wlbar input[type=text]{flex:1;min-width:150px}
.wlrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:start;
  padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.wlhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wlexam{display:flex;gap:4px;flex-wrap:wrap}
.wlexam span{font-size:10.5px;line-height:1.7;padding:0 5px;border-radius:4px;background:var(--orange-l);color:var(--orange);white-space:nowrap}
.wlsenses{margin-top:3px;display:flex;flex-direction:column;gap:1px}
.wlsenses div{font-size:13.5px;color:var(--tx2);line-height:1.55}
.wlsenses b{color:var(--tx);font-weight:600;margin-right:5px}
.wlrow:hover{background:var(--bg3)}
.wlrow.playing{background:var(--orange-l)}
.wlrow.playing .wlw{color:var(--orange)}
.wlrow .wlidx{color:var(--tx3);font-size:12px;text-align:right}
.wlrow .wlw{font-size:16px;font-weight:600}
.wlrow .wlipa{font-size:12.5px;color:var(--tx2);display:block;font-weight:400}
.wlrow .wlmean{font-size:13.5px;color:var(--tx2)}
.wlspk{color:var(--tx3);display:flex;align-items:center}
.wlrow:hover .wlspk{color:var(--orange)}
.speaking .wlspk{color:var(--orange)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.wlrow.playing .wlspk{animation:pulse .9s infinite}
/* 结果页 */
.resnum{font-size:52px;font-weight:700;color:var(--orange);text-align:center;line-height:1.1}
.result-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.result-item .yours{color:var(--wrong);text-decoration:line-through}
@media (max-width:430px){
  .tabs{gap:15px;padding:0 14px}
  .tabs button{font-size:13.5px}
  .topbar{padding:11px 14px}
  .topbar h1{font-size:16px}
  #btnReview{padding:5px 9px;font-size:12.5px}
  #hdr{gap:0;padding:calc(4px + env(safe-area-inset-top)) 6px 4px;max-width:none}
  #hdr .chap{font-size:12px;padding:0 6px;margin-right:2px}
  #hdr .mode{font-size:12px;padding:6px}
  #hdr .icobtn{width:36px;height:36px}
  .wlrow{grid-template-columns:26px 1fr auto;gap:8px}
  .wlrow .wlmean{display:none}
}
@media (max-width:560px){
  #ansWord{font-size:24px}
  #typeIn,#mirror{font-size:23px}
  .page{padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
  input[type=text],textarea,select{font-size:16px}
}
/* OCR 词本导入 */
.ocrActions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.ocrStageWrap{display:flex;justify-content:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:hidden}
.ocrStage{position:relative;display:inline-block;max-width:100%;line-height:0;overflow:hidden;border-radius:8px;touch-action:none}
.ocrStage img{display:block;max-width:100%;max-height:55vh;width:auto;height:auto;pointer-events:none;user-select:none}
.ocrCropBox{position:absolute;left:5%;top:5%;width:90%;height:90%;box-sizing:border-box;border:2px solid #fff;outline:1px solid var(--orange);box-shadow:0 0 0 9999px rgba(0,0,0,.48);cursor:move;touch-action:none}
.ocrCropBox::after{content:"拖动选词";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;line-height:1.2;color:#fff;background:rgba(0,0,0,.55);padding:4px 7px;border-radius:999px;pointer-events:none;white-space:nowrap}
.ocrHandle{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-sizing:border-box;touch-action:none}
.ocrHandle[data-dir="nw"]{left:-10px;top:-10px;cursor:nwse-resize}
.ocrHandle[data-dir="ne"]{right:-10px;top:-10px;cursor:nesw-resize}
.ocrHandle[data-dir="sw"]{left:-10px;bottom:-10px;cursor:nesw-resize}
.ocrHandle[data-dir="se"]{right:-10px;bottom:-10px;cursor:nwse-resize}
.ocrHint{font-size:12.5px;color:var(--tx2);line-height:1.65;margin-top:8px}
.ocrProgress{display:flex;align-items:center;gap:9px;padding:14px;background:var(--orange-l);border-radius:10px;color:var(--orange);font-size:13px}
.ocrProgress i{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ocrReviewHead{display:grid;grid-template-columns:30px minmax(110px,.85fr) minmax(150px,1.4fr) 34px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.ocrReviewRow{display:grid;grid-template-columns:30px minmax(110px,.85fr) minmax(150px,1.4fr) 34px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.ocrReviewRow input[type=checkbox]{width:17px;height:17px;accent-color:var(--orange)}
.ocrReviewRow input[type=text]{min-width:0;width:100%;font-size:13.5px;padding:8px 9px}
.ocrReviewRow input.bad{border-color:var(--wrong)}
.ocrTips{text-align:left;max-width:440px;margin:8px auto 0;line-height:1.65}
.ocrTips ul{margin:6px 0 8px;padding-left:1.2em}
.ocrReviewTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ocrErrorBox{background:rgba(236,106,94,.08);border:1px solid var(--wrong);border-radius:10px;padding:10px 12px;margin-top:10px}
.ocrErrorBox .ocrHint{margin:0}
.ocrErrorBox .btn{margin-top:8px}
.minerow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.minerow .wlw{font-size:17px;font-weight:600}
.minerow .wlsub{font-size:13.5px;color:var(--tx2);line-height:1.45;margin-top:2px}
.mineacts{display:flex;gap:2px;align-items:center}
.emptybox{text-align:center;color:var(--tx2);padding:28px 12px}
.emptybox .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wlmore{display:block;width:100%;margin:14px 0 8px;min-height:42px}
.mineHead{align-items:flex-start}
.ocrReviewRow .icobtn{color:var(--tx3)}
.ocrReviewRow .icobtn:hover{color:var(--wrong)}
.ocrEmpty{text-align:center;color:var(--tx2);padding:30px 0;font-size:13.5px}
@media (max-width:560px){
  .ocrReviewHead{display:none}
  .ocrReviewRow{grid-template-columns:26px 1fr 34px;gap:7px;align-items:start}
  .ocrReviewRow input[type=text]{font-size:16px}
  .ocrReviewRow input[type=text]:last-of-type{grid-column:2;margin-top:-2px}
  .ocrReviewRow .icobtn{grid-column:3;grid-row:1 / span 2}
  .bookbox{flex-wrap:wrap}
  .bookacts{width:100%}
  .bookacts .btn{flex:1}
  .mineHead{flex-direction:column}
  .mineHead .mineActions{width:100%}
  .mineActions .btn{flex:1;min-height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,(vol||0.2)*S.set.volume),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.02);
}

/* ---------- 发音 ---------- */
let curAudio=null, speakTimer=null;
function hasRecording(w){
  return !!(w&&w.id&&!w.custom&&/^\d+$/.test(String(w.id)));
}
function audioCandidates(w,accent){
  if(!hasRecording(w)) return [];
  const id=w.id, tag=(accent==='us'?'us':'uk');
  return [`audio/${id}_${tag}.mp3`,`audio/${id}_${tag}.m4a`];   // 个别词只有系统语音合成的 m4a
}
function audioSrc(w,accent){ return audioCandidates(w,accent)[0]; }
function ttsPlay(text,cb){
  if(!speechOK){ cb&&cb(); return; }
  try{
    const u=new SpeechSynthesisUtterance(text);
    const v=VOICES.find(v=>/en/i.test(v.lang)&&(S.set.accent==='us'?/US/i.test(v.lang):/GB/i.test(v.lang)))||VOICES.find(v=>/en/i.test(v.lang));
    if(v) u.voice=v; u.lang=v?v.lang:(S.set.accent==='us'?'en-US':'en-GB');
    u.rate=Math.max(0.5,Math.min(1.5,S.set.speed));
    u.onend=()=>cb&&cb(); u.onerror=()=>cb&&cb();
    speechSynthesis.speak(u);
  }catch(e){ cb&&cb(); }
}
function stopAudio(){
  if(curAudio){ try{curAudio.pause();curAudio.currentTime=0;}catch(e){} curAudio=null; }
  if(speechOK){ try{speechSynthesis.cancel();}catch(e){} }
  clearTimeout(speakTimer);
}
/* 播放单词音频 times 遍 */
function playWord(w,times,cb){
  stopAudio();
  times=times||S.set.repeat||1;
  const cands=audioCandidates(w,S.set.accent);
  let n=0;
  const once=()=>{
    if(n>=times){ cb&&cb(); return; }
    n++;
    let ci=0, settled=false;
    const after=()=>{ if(settled) return; settled=true; speakTimer=setTimeout(once, n<times?320:0); };
    const attempt=()=>{
      if(settled) return;
      if(ci>=cands.length){ ttsPlay(w.word,after); return; }   // 录音都没有 → 系统语音
      const a=new Audio(cands[ci++]);
      curAudio=a; a.playbackRate=Math.max(0.5,Math.min(1.5,S.set.speed));
      a.onended=after;
      a.onerror=()=>{ if(!settled){ a.onerror=null; attempt(); } };
      const pr=a.play();
      if(pr&&pr.catch) pr.catch(()=>{ if(!settled){ a.onerror=null; attempt(); } });
    };
    attempt();
  };
  once();
}
function playExample(w,cb){
  const ex=(w.ex||'').replace(new RegExp(w.word,'ig'),'');
  if(!ex){ cb&&cb(); return; }

}
function loadVoices(){
  if(!speechOK) return;
  const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const pre=['Samantha','Alex','Daniel','Karen','Moira','Tessa','Google US English','Google UK English Female','Microsoft Aria'];
  all.sort((a,b)=>((pre.findIndex(n=>a.name.includes(n))+1||99)-(pre.findIndex(n=>b.name.includes(n))+1||99))||a.name.localeCompare(b.name));
  VOICES=all;
}

/* ---------- 拆分助记 ma·p ---------- */
function syllables(word){
  const w=String(word||'').toLowerCase();
  if(!/^[a-z]+$/.test(w)) return word;
  if(w.length<=3) return w.slice(0,2)+'·'+w.slice(2);      // map -> ma·p
  const isV=c=>'aeiouy'.includes(c);
  const g=[]; let i=0;
  while(i<w.length){ if(isV(w[i])){ const st=i; while(i<w.length&&isV(w[i]))i++; g.push([st,i-1]); } else i++; }
  if(g.length<2) return w.slice(0,2)+'·'+w.slice(2);
  const cuts=[];
  for(let k=0;k<g.length-1;k++){
    const vEnd=g[k][1], nStart=g[k+1][0], cons=w.slice(vEnd+1,nStart);
    cuts.push(cons.length<=1 ? vEnd+1 : nStart-1);
  }
  let out='',prev=0;
  for(const c of cuts){ if(c<=prev||c>=w.length) continue; out+=w.slice(prev,c)+'·'; prev=c; }
  out+=w.slice(prev);
  return out.includes('·')?out:word;
}
/* ---------- 随机 ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,n,exclude){const out=[];const pool=arr.filter(x=>x!==exclude);shuffle(pool);for(let i=0;i<n&&i<pool.length;i++)out.push(pool[i]);return out;}

/* ---------- 我的生词（IndexedDB，可添加、可保存、可备份） ---------- */
const IDB_NAME='word_dictation_db';
const IDB_STORE='custom_words';
const IDB_VERSION=1;
let custom=[];
let customSaveChain=Promise.resolve();
function normalizeCustomEntries(list){
  return (Array.isArray(list)?list:[]).filter(c=>c&&c.word).map((c,i)=>({
    ...c,
    id:c.id||('c'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5)),
    word:String(c.word).trim(),
    meaning:String(c.meaning||'').trim(),
    hidden:!!c.hidden
  }));
}
function openWordsDb(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
  });
}
async function idbReadCustom(){
  const db=await openWordsDb();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).getAll();
      req.onsuccess=()=>resolve(normalizeCustomEntries(req.result));
      req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
    });
  } finally { db.close(); }
}
async function idbWriteCustom(words){
  const db=await openWordsDb();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      const store=tx.objectStore(IDB_STORE);
      store.clear();
      normalizeCustomEntries(words).forEach(word=>store.put(word));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
      tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
    });
  } finally { db.close(); }
}
function readLegacyCustom(){
  try{ return normalizeCustomEntries(JSON.parse(localStorage.getItem(LS+'_custom')||'[]')); }
  catch(e){ return []; }
}
async function loadCustom(){
  try{
    const stored=await idbReadCustom();
    if(stored.length){ custom=stored; return; }
    const legacy=readLegacyCustom();
    if(legacy.length){
      custom=legacy;
      await idbWriteCustom(custom);
      try{ localStorage.removeItem(LS+'_custom'); }catch(e){}
      return;
    }
    custom=[];
  }catch(e){
    custom=readLegacyCustom();
  }
}
function saveCustom(){
  const snapshot=normalizeCustomEntries(custom);

      const idx=custom.findIndex(c=>c.id===existing.id);
      if(idx<0){ alert('找不到这条单词，请重新打开生词本'); return; }
      custom[idx]={...custom[idx], word, ipa_us:ipa, ipa_gb:ipa, meaning:mean, hidden:false};
      await saveCustom(); rebuildCustom(); el.remove(); renderHome('mine');
      showToast('已更新 '+word);
      return;
    }
    const bulk=el.querySelector('#aw_bulk').value.trim();
    let added=0;
    const push=(wrd,ipa2,mean2)=>{
      wrd=String(wrd||'').replace(/^\s*\d+[\.、\)]\s*/,'').trim();
      if(!wrd||!validEnglish(wrd)) return;
      if(WORDS.some(w=>!w.hidden&&w.word.toLowerCase()===wrd.toLowerCase())) return;
      custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), word:wrd, ipa_us:ipa2||'', ipa_gb:ipa2||'', pos:'', meaning:mean2||'', hidden:false});
      added++;
    };
    if(word) push(word, ipa, mean);
    if(bulk){
      bulk.split(/\n/).forEach(line=>{
        line=line.trim(); if(!line) return;
        const m=line.split(/\t|,|，|\s{2,}/);
        if(m.length>=2) push(m[0], '', m.slice(1).join(' ').trim());
        else { const m2=line.match(/^([A-Za-z][A-Za-z'’\- ]+?)\s+(.{1,})$/); if(m2) push(m2[1],'',m2[2]); else push(line,'',''); }
      });
    }
    if(!added){ alert('没有可添加的新单词（可能已存在，或不是英文）'); return; }
    await saveCustom(); rebuildCustom(); el.remove(); renderHome('mine');
    showToast('已保存 '+added+' 个单词');
  };
}
function validEnglish(word){
  return /^[A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*){0,3}$/.test(String(word||'').trim());
}
function ocrUserMessage(status, raw, name){
  const msg=String(raw||'');
  if(status===503 || /尚未配置|GOOGLE_VISION|API key/i.test(msg)) return 'OCR 服务尚未配置。可以先手动添加单词，开通后再拍照导入。';
  if(/尚未开通高精度/.test(msg)) return '高精度文字识别还没开通。请到百度智能云「文字识别 → 应用列表 → 创建应用」，勾选「通用文字识别（高精度含位置版）」。也可以先手动添加。';
  if(/尚未开通手写/.test(msg)) return '手写识别还没开通。当前默认不用手写接口。若仍看到这句，请确认没有打开手写开关。也可以先手动添加。';
  if(/调用次数已达上限/.test(msg)) return '识别次数用完了。可以明天再试，或先手动添加单词。';
  if(/过于频繁|识别过于频繁/.test(msg)) return '识别太频繁，请稍等一分钟再试。';
  if(/无法获取访问凭证|访问凭证无效/.test(msg)) return '百度账号还没配对成功。可以先手动添加单词。';
  if(status===403) return '请从正式站点打开后再试拍照识别。当前页面不能调用识别服务。';
  if(status===429) return '识别太频繁，请稍等一分钟再试。';
  if(status===413 || /图片过大|请求内容过大/.test(msg)) return '图片太大，请缩小选区后再试。';
  if(/图片格式/.test(msg)) return '这张图的格式不受支持。请换 JPEG 或 PNG，手机 HEIC 请先改存成 JPG。';
  if(status===404) return '识别服务地址不对。可以先手动添加单词。';
  if(name==='AbortError') return '识别超时，请重试，或改为手动添加。';
  if(name==='TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(msg)) return '网络不通，识别失败。请检查网络后重试，或改为手动添加。';
  if(status>=500) return '识别服务暂时不可用，请稍后再试，或改为手动添加。';
  if(/key|密钥|token/i.test(msg)) return '识别服务暂时不可用，请稍后再试，或改为手动添加。';
  return msg || '识别失败，请重试，或改为手动添加。';
}
function ocrEndpoint(){
  const configured=String(window.OCR_API_URL||'').trim().replace(/\/+$/,'');
  if(!configured || /YOUR_SUBDOMAIN/i.test(configured)) return '';
  return configured;
}
function dataUrlBytes(dataUrl){
  const comma=String(dataUrl).indexOf(',');
  return comma<0?0:Math.ceil((dataUrl.length-comma-1)*.75);
}
function cleanOcrWord(value){
  return String(value||'').replace(/^\s*\d{1,3}\s*[.)、:：\-]\s*/,'').replace(/\s+/g,' ').trim();
}

function wlFiltered(){
  const q=norm(wl.q);
  return WORDS.map((w,i)=>i).filter(i=>{
    const w=WORDS[i];
    if(w.hidden) return false;
    if(wl.unit && w.unit!==+wl.unit) return false;
    if(q && !(norm(w.word).includes(q)||w.meaning.includes(wl.q.trim())||(w.senses||[]).some(sn=>sn.text.includes(wl.q.trim())))) return false;
    return true;
  });
}
function renderWordTable(body){
  const chapterUnits=units();
  body.innerHTML=`
    <div class="wlbar">
      <input type="text" id="wlq" placeholder="搜索单词 / 中文释义…" value="${esc(wl.q)}" aria-label="搜索单词">
      <select id="wlu" aria-label="按页筛选"><option value="0">全部页</option>${Object.keys(chapterUnits).map(k=>`<option value="${k}" ${wl.unit==k?'selected':''}>第 ${k} 页（${chapterUnits[k].length}）</option>`).join('')}</select>
      <div class="seg" role="group" aria-label="发音口音"><button type="button" data-acc="us" class="${S.set.accent==='us'?'on':''}">美音</button><button type="button" data-acc="uk" class="${S.set.accent==='uk'?'on':''}">英音</button></div>
      <button class="btn sm ${wl.auto?'primary':''}" id="wlauto" type="button">${wl.auto?'停止连播':'连播'}</button>
    </div>
    <div class="sub" style="margin:8px 2px 6px">点一行就发音。共 <b id="wlc"></b> 个单词</div>
    <div id="wlrows"></div>`;
  paintRows();
  let wlTimer=null;
  $('#wlq').oninput=e=>{ wl.q=e.target.value; wl.limit=80; clearTimeout(wlTimer); wlTimer=setTimeout(paintRows,120); };
  $('#wlu').onchange=e=>{ wl.unit=+e.target.value; wl.limit=80; paintRows(); };
  body.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{ S.set.accent=b.dataset.acc; save(); if(typeof syncAccent==='function') syncAccent(); renderWordTable(body); });
  $('#wlauto').onclick=()=>{ wl.auto=!wl.auto; if(wl.auto){ const ids=wlFiltered(); const first=wl.cur!=null&&ids.includes(wl.cur)?wl.cur:ids[0]; playAt(first); } else { stopAudio(); wl.cur=null; paintRows(); } };
}
function paintRows(){
  const ids=wlFiltered(), box=$('#wlrows'); if(!box) return;
  const shown=ids.slice(0, wl.limit||80);
  const count=$('#wlc'); if(count) count.textContent=ids.length;
  if(!ids.length){ box.innerHTML='<div class="emptybox">没有匹配的单词</div>'; return; }
  box.innerHTML=shown.map(i=>{
    const w=WORDS[i], p=S.prog[i]||{};
    const ipa=S.set.accent==='us'?(w.ipa_us||''):(w.ipa_gb||w.ipa_us||'');
    return `<div class="wlrow ${wl.cur===i?'playing':''}" data-i="${i}" title="点击播放">
      <span class="wlidx">${i+1}</span>
      <div>
        <div class="wlhead"><span class="wlw">${esc(w.word)}</span>${(w.exam&&w.exam.length)?`<span class="wlexam">${w.exam.slice(0,3).map(e=>`<span>${esc(e)}</span>`).join('')}</span>`:''}</div>
        <div class="wlipa">${esc(ipa)}${p.wrong?` · <span style="color:var(--wrong)">错 ${p.wrong} 次</span>`:''}</div>
        <div class="wlsenses">${(w.senses||[{pos:w.pos,items:[w.meaning]}]).map(sn=>`<div><b>${esc(sn.pos||w.pos)}</b>${esc((sn.items&&sn.items.length?sn.items:[sn.text]).join(' · '))}</div>`).join('')}</div>
      </div>
      <span style="display:flex;gap:2px;align-items:center">
        <button class="icobtn" type="button" data-star="${i}" aria-label="${p.star?'取消收藏':'收藏'}" title="收藏" style="color:${p.star?'var(--orange)':'var(--tx3)'}">${p.star?ICON.starOn:ICON.star}</button>
        <span class="wlspk">${ICON.spk.replace('width="30" height="30"','width="19" height="19"')}</span>
      </span>
    </div>`;}).join('')+(ids.length>shown.length?`<button class="btn wlmore" type="button" id="wlmore">还有 ${ids.length-shown.length} 个，继续加载</button>`:'');
  const more=$('#wlmore'); if(more) more.onclick=()=>{ wl.limit=(wl.limit||80)+80; paintRows(); };
  box.querySelectorAll('.wlrow').forEach(row=>{
    row.onclick=e=>{ if(e.target.closest('button')) return; const i=+row.dataset.i; if(wl.cur===i) { stopAudio(); wl.cur=null; paintRows(); } else playAt(i); };
  });
  box.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.star,p=P(i); p.star=!p.star;
    if(p.star&&S.set.autoReviewCollect&&!p.due) p.due=Date.now();
    save(); paintRows();
  });
}
/* 播放某一行；连播时自动继续 */
function playAt(i){
  if(i==null) return;
  const w=WORDS[i];
  const pos=wlFiltered().indexOf(i);
  if(pos>=0 && pos>=(wl.limit||80)) wl.limit=pos+1;
  wl.cur=i; paintRows();
  const el=document.querySelector(`.wlrow[data-i="${i}"]`);
  if(el&&el.scrollIntoView) el.scrollIntoView({block:'center',behavior:'smooth'});
  playWord(w,1,()=>{
    if(!wl.auto) { wl.cur=null; paintRows(); return; }
    const ids=wlFiltered(); const k=ids.indexOf(i);
    const nxt=ids[(k+1)%ids.length];
    setTimeout(()=>{ if(wl.auto) playAt(nxt); }, 500);
  });
}
/* ---------- 错误本 ---------- */
function renderWrong(body){
  const list=wrongList();
  body.innerHTML=`
    <div class="rowset" style="border:none;padding:6px 0 12px">
      <div><div class="lb">共 ${list.length} 个错词</div><div class="sub">答错的单词会自动进入这里，连续答对两次后自动移出</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="drillWrong" ${list.length?'':'disabled'}>开始纠错</button>
      </div>
    </div>
    ${list.length? list.map(i=>{const w=WORDS[i],p=S.prog[i],ws=S.wrongSpell[i]||'';
      return `<div class="wcard">
        <div class="w q">${esc(w.word)}</div>
        <div class="i">${esc(w.ipa_us||'')} ${esc(w.ipa_gb||'')}</div>
        <div class="m">${esc(w.pos)} ${esc(w.meaning)}</div>
        <div class="syn">${ws?`你的拼写：<span style="color:var(--wrong)">${esc(ws)}</span> · `:''}错误 ${p.wrong} 次 · 熟练度 ${p.lv}/9</div>
        <div class="tools">
          <button data-act="play" data-i="${i}" title="播放">${ICON.spk.replace('width="30" height="30"','width="17" height="17"')}</button>
          <button data-act="star" data-i="${i}" class="${p.star?'on':''}" title="收藏">${p.star?ICON.starOn:ICON.star}</button>
          <button data-act="del" data-i="${i}" title="移出错词本">${ICON.trash}</button>
        </div></div>`;}).join('')
    : `<div class="emptybox">还没有错词<br><span class="sub">去章节里听写几轮，拼错的词会自动出现在这里。</span></div>`}`;
  if($('#drillWrong')) $('#drillWrong').onclick=()=>startList(list,'纠错模式');
  body.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, p=P(i), act=b.dataset.act;
    if(act==='play') playWord(WORDS[i]);
    if(act==='star'){ p.star=!p.star; if(p.star&&S.set.autoReviewCollect&&!p.due) p.due=Date.now(); save(); renderWrong(body); }
    if(act==='del'){ p.wrong=0; delete S.wrongSpell[i]; save(); renderWrong(body); }
  });
}
/* ---------- 统计 ---------- */
function renderStats(body){
  let ok=0,bad=0,done=0,mastered=0,star=0;
  WORDS.forEach((w,i)=>{const p=S.prog[i]; if(!p)return; ok+=p.ok;bad+=p.wrong; if(p.ok||p.wrong)done++; if(p.lv>=5)mastered++; if(p.star)star++;});
  const u=units();
  body.innerHTML=`
    <div class="grid4" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px">
      ${[['累计答题',ok+bad],['正确率',(ok+bad?Math.round(ok/(ok+bad)*100):0)+'%'],['已学 / 掌握',done+' / '+mastered],['错词 / 收藏',wrongList().length+' / '+star]]
        .map(([k,v])=>`<div class="bookbox" style="flex-direction:column;align-items:flex-start;gap:2px;margin:0">
          <div style="font-size:24px;font-weight:700">${v}</div><div style="font-size:12.5px;color:var(--tx2)">${k}</div></div>`).join('')}
    </div>
    <div style="margin-top:18px;font-size:14px;font-weight:600">各章节掌握情况</div>
    <div class="tablewrap"><table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px">
      <thead><tr style="color:var(--tx2);font-size:12px"><th style="text-align:left;padding:8px 4px">章节</th><th>词量</th><th>已练</th><th>掌握</th><th>正确率</th></tr></thead>
      <tbody>${Object.keys(u).sort((a,b)=>a-b).map(k=>{
        const list=u[k];let o=0,b=0;list.forEach(i=>{const p=S.prog[i];if(p){o+=p.ok;b+=p.wrong;}});
        const {done:dn,mastered:m}=unitProgress(list);
        return `<tr style="border-top:1px solid var(--line)"><td style="padding:9px 4px">第 ${k} 页</td><td align="center">${list.length}</td><td align="center">${dn}</td><td align="center">${m}</td><td align="center">${(o+b)?Math.round(o/(o+b)*100)+'%':'—'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div style="margin-top:20px;font-size:14px;font-weight:600">最近练习</div>
    ${S.hist.length? S.hist.slice(0,20).map(h=>`<div class="result-item"><span style="flex:1">${esc(formatName(h.name||''))}</span><span>${h.total} 题</span><span style="color:var(--orange)">${h.acc}%</span><span style="color:var(--tx2);font-size:12px">${new Date(h.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')
      : `<div style="color:var(--tx2);padding:14px 0">还没有练习记录</div>`}
  `;
}
</script>
<script>
/* =========================================================
   听写引擎
   ========================================================= */
let D=null;
let qTimer=null;
let walkTimer=null;
function cancelQuestion(){
  clearTimeout(qTimer); qTimer=null;
  clearTimeout(walkTimer); walkTimer=null;
}
function armQuestion(fn, ms){
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ qTimer=null; fn(); }, ms);
}
function startUnit(u,mode){ S.set.chapter=u; save(); startList(units()[u].slice(),'list_'+u,mode); }
const DRILL_TIPS={
  dictation:'听发音，在横线上拼写，然后点提交',
  smart:'这一轮会混合听写、听选和看词选义',
  soundmean:'听发音，点选正确的中文',
  wordmean:'看单词，点选正确的中文',
  spell:'看中文，拼出英文，然后点提交',
  walkman:'自动往下读。点喇叭可以重听'
};
function startList(ids,name,mode,chapter){
  cancelQuestion();
  if(!ids||!ids.length){ showToast('没有可练习的单词', false); return; }
  const sourceIds=ids.slice();
  const q=S.set.shuffle?shuffle(ids.slice()):ids.slice();
  D={ ids:q, sourceIds, name, chapter:chapter||S.set.chapter, mode:mode||S.set.mode, idx:0, phase:'ask',
      stats:{ok:0,bad:0,answered:0,start:Date.now()}, wrongSet:{}, last:null, cur:null, opts:null, locked:false, fixTarget:null, round:1 };
  wl.auto=false; wl.cur=null; stopAudio();
  showScreen('Drill');
  $('#hdrChap').textContent = formatName(name);
  $('#hdrModeTxt').textContent = MODES[D.mode]||MODES.dictation;
  if(!sessionStorage.getItem('tip:'+D.mode)){ showToast(DRILL_TIPS[D.mode]||DRILL_TIPS.dictation); sessionStorage.setItem('tip:'+D.mode,'1'); }
  nextQuestion();
}
function showToast(t, ok){
  const el=document.createElement('div'); el.id='toast';
  el.innerHTML=`<span>${ok===false?'': '✅ '}${esc(t)}</span><button type="button" aria-label="关闭">✕</button>`;
  document.body.appendChild(el);
  el.querySelector('button').onclick=()=>el.remove();
  setTimeout(()=>{el.remove();},6000);
}
function curWord(){ return WORDS[D.ids[D.idx]]; }
function questionMode(){
  if(D.mode==='smart'){ const r=Math.random(); return r<0.5?'dictation':(r<0.75?'soundmean':'wordmean'); }
  return D.mode;
}
/* 渲染题目 */
function nextQuestion(){
  if(D.idx>=D.ids.length) return maybeRecycle();
  const w=curWord(), m=questionMode();
  D.cur={i:D.ids[D.idx],w,m}; D.phase='ask'; D.locked=false; D.fixTarget=null;
  const inp=$('#typeIn'); inp.value=''; inp.disabled=false; updateMirror();
  $('#opts').classList.add('hide'); $('#opts').innerHTML='';
  $('#ansBox').innerHTML='';
  if(D.last) renderLast();
  renderQuestion();
  if(D.stats.answered>0) $('#bar').classList.remove('hide'); else $('#bar').classList.add('hide');
  $('#counter').textContent=`${D.stats.answered}/${D.ids.length}`;
  $('#bar').querySelector('i').style.width=(D.stats.answered/D.ids.length*100)+'%';
  $('#spkBtn').classList.toggle('hide', m==='wordmean'||m==='walkman');
  $('#typeWrap').classList.toggle('hide', m==='soundmean'||m==='wordmean'||m==='walkman');
  $('#tipTxt').textContent = (m==='dictation'||m==='spell') ? '拼完点提交' : (m==='soundmean'||m==='wordmean' ? '点选一项' : '');
  const hint=$('#voiceHint');
  if(hint){
    const sys=!hasRecording(w);
    hint.textContent=sys?'这个词用手机系统朗读':'';
    hint.classList.toggle('hide', !sys || m==='wordmean');
  }
  if(m==='soundmean'||m==='wordmean'){ renderOptions(w); playQuestionAudio(m); }
  else if(m==='dictation'||m==='smart'){ playQuestionAudio(m); }
  else if(m==='spell'){ /* 不自动播放，可点喇叭 */ $('#spkBtn').classList.remove('hide'); }
  if(m==='dictation'||m==='spell'||m==='smart') setTimeout(()=>inp.focus(),30);
  if(m==='walkman') walkmanTick();
  saveSession();
}
function playQuestionAudio(m){
  const w=curWord();
  if(m==='spell') return;
  if(m==='wordmean') return; // 看词选义不读（避免直接给答案）
  playWord(w);
}
/* 上一题结果（红=错 / 深色=对） */
function renderLast(){
  const L=D.last; if(!L) return;
  const w=L.w, p=WORDS[L.i];
  const box=$('#ansBox');
  box.innerHTML=`
    <div id="ansWord" class="${L.ok?'right':'wrong'}">${esc(p.word)}</div>
    ${(S.set.mnemonic&&L.ok===false)?`<div style="font-size:14px;color:var(--tx2);letter-spacing:1px">${esc(syllables(p.word))}</div>`:''}
    <div id="ansIpa">${esc(S.set.accent==='us'?(p.ipa_us||''):(p.ipa_gb||''))}</div>
    <div id="ansMean">${esc(p.pos)} ${esc(p.meaning)}</div>
    ${(S.set.showExample&&p.ex)?`<div id="ansEx">${hlWord(p.ex,p.word)}</div>`:''}`;
}
function renderOptions(w){
  const others=pick(WORDS.map(x=>x.meaning).filter(m=>m!==w.meaning),3,w.meaning);
  const list=shuffle([w.meaning,...others]);
  D.opts=list;
  $('#opts').innerHTML=list.map((m,i)=>`<button class="opt" data-m="${esc(m)}"><span class="num">${i+1}</span><span>${esc(m)}</span></button>`).join('');
  $('#opts').classList.remove('hide');
  $$('#opts .opt').forEach(b=>b.onclick=()=>chooseOption(b.dataset.m,b));
}
function hlWord(s,w){
  const re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)\\b','ig');
  return esc(s).replace(re,'<b>$1</b>');
}
/* 提交拼写 */
function submitTyped(){
  if(!D||D.phase!=='ask'||D.locked) return;
  const inp=$('#typeIn'), val=inp.value;
  if(!val.trim()) return;
  const w=curWord();
  if(norm(val)===norm(w.word)) judge(true,val);
  else judge(false,val);
}
function chooseOption(m,btn){
  if(!D||D.phase!=='ask'||D.locked) return;
  const w=curWord();
  const correct=norm(m)===norm(w.meaning)||m===w.meaning;
  if(!correct){ btn.classList.add('wrong'); }
  judge(correct, correct?'':m, m);
}
function judge(ok,input,chosen){
  if(!D) return;
  const t=$('#toast'); if(t) t.remove();
  D.locked=true;
  const i=D.ids[D.idx], w=WORDS[i], p=P(i), now=Date.now();
  const target=w.word;
  if(ok){
    p.ok++; p.last=now; p.lv=Math.min(9,(p.lv||0)+1); p.due=now+EBB[Math.min(p.lv-1,EBB.length-1)];
    if(p.wrong>0){ p.fix=(p.fix||0)+1; if(p.fix>=2){ p.wrong=0; p.fix=0; delete S.wrongSpell[i]; } }
    D.stats.ok++;
    sfx.right();
  }else{
    p.wrong++; p.last=now; p.lv=0; p.fix=0; p.due=now+EBB[0];
    S.wrongSpell[i]=input||''; D.wrongSet[i]=true;
    D.stats.bad++;
    sfx.wrong();
    if(S.set.autoReviewCollect){ p.star=true; }
  }
  D.stats.answered++;
  D.last={i,ok,input:w.word,w:{...w,target}};
  renderLast();
  $('#counter').textContent=`${D.stats.answered}/${D.ids.length}`;
  $('#bar').querySelector('i').style.width=(D.stats.answered/D.ids.length*100)+'%';
  save();

  if(ok){
    D.idx++;
    armQuestion(nextQuestion, S.set.continuous? 500 : 750);
    return;
  }
  // 答错
  if(S.set.requireFix && D.cur.m!=='soundmean' && D.cur.m!=='wordmean'){
    D.phase='fix'; D.fixTarget=target;
    $('#tipTxt').innerHTML=`照着拼写一遍：<b>${esc(target)}</b>　（Shift 跳过）`;
    const inp=$('#typeIn'); inp.value=''; updateMirror(); inp.focus();
    $$('#opts .opt').forEach(b=>{ if(norm(b.dataset.m)===norm(w.meaning)) b.classList.add('right'); });
    sfx.tick();
  }else{
    $$('#opts .opt').forEach(b=>{ if(b.dataset.m===w.meaning||norm(b.dataset.m)===norm(w.meaning)) b.classList.add('right'); });
    D.idx++;
    armQuestion(nextQuestion, S.set.continuous? 700 : 1400);
  }
}
/* 纠错：写对才继续 */
function fixSubmit(){
  if(!D||D.phase!=='fix') return;
  const inp=$('#typeIn'), val=inp.value;
  if(!val.trim()) return;
  if(norm(val)===norm(D.fixTarget)){
    sfx.right();
    D.phase='ask'; D.idx++;
    armQuestion(nextQuestion,420);
  }else{
    sfx.wrong();
    inp.value=''; updateMirror();
    inp.style.color='var(--wrong)';
    setTimeout(()=>inp.style.color='',400);
  }
}
/* 错词循环 */
function maybeRecycle(){
  const wrongIds=Object.keys(D.wrongSet).map(Number).filter(i=>(D.wrongSet[i]||0)<2);
  if(S.set.wrongCycle && wrongIds.length && D.round<4){
    D.round++;
    D.ids=D.ids.concat(wrongIds.map(i=>(D.wrongSet[i]=(D.wrongSet[i]||0)+1, i)));
    D.idx=D.ids.length-wrongIds.length;
    showToast('错词循环：继续巩固 '+wrongIds.length+' 个错词');
    return nextQuestion();
  }
  finish();
}
/* 随身听 */
function walkmanTick(){
  const w=WORDS[D.ids[D.idx%D.ids.length]];
  playWord(w,1,()=>{ walkTimer=setTimeout(()=>{ D.idx++; if(D.idx>=D.ids.length) D.idx=0; nextQuestion(); }, S.set.interval*1000); });
}
/* 结束 → 结果页 */
function finish(){
  cancelQuestion();
  const st=D.stats, total=st.ok+st.bad, acc=total?Math.round(st.ok/total*100):0;
  const mins=Math.max(1,Math.round((Date.now()-st.start)/60000));
  const mode=D.mode, chapter=D.chapter;
  S.hist.unshift({t:Date.now(),name:D.name,total,acc,ok:st.ok,bad:st.bad}); S.hist=S.hist.slice(0,50);
  const wrongIds=Object.keys(D.wrongSet).map(Number);
  const name=D.name;
  save(); localStorage.removeItem(SS); sfx.done();
  $('#resultBody').innerHTML=`
    <div style="text-align:center;margin-top:20px">
      <div style="font-size:13px;color:var(--tx2)">听写完成 · ${esc(name)}</div>
      <div class="resnum">${acc}%</div>
      <div style="color:var(--tx2);font-size:13px">正确率</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px">
      ${[['答题',total],['答对',st.ok],['答错',st.bad]].map(([k,v])=>`<div class="bookbox" style="flex-direction:column;align-items:center;gap:2px;margin:0;padding:14px">
        <div style="font-size:22px;font-weight:700;color:${k==='答错'&&v?'var(--wrong)':'var(--tx)'}">${v}</div><div style="font-size:12px;color:var(--tx2)">${k}</div></div>`).join('')}
    </div>
    <div style="color:var(--tx2);font-size:12.5px;text-align:center;margin-top:10px">用时约 ${mins} 分钟 · 已加入记忆规划</div>
    <div class="rowset" style="justify-content:center;gap:10px;margin-top:20px;border:none">
      <button class="btn primary" id="againBtn">再练一遍</button>
      ${wrongIds.length?`<button class="btn" id="seeWrong">查看错词（${wrongIds.length}）</button>`:''}
      <button class="btn" id="homeBtn">返回首页</button>
    </div>
    ${wrongIds.length?`<div style="margin-top:14px"><div style="font-size:14px;font-weight:600;margin-bottom:6px">本轮错词</div>
      ${wrongIds.map(i=>{const w=WORDS[i];return `<div class="result-item">
        <span style="flex:1"><b>${esc(w.word)}</b> <span style="color:var(--tx2)">${esc(w.pos)} ${esc(w.meaning)}</span></span>
        ${S.wrongSpell[i]?`<span class="yours">${esc(S.wrongSpell[i])}</span>`:''}
        <button class="icobtn" data-play="${i}">${ICON.spk.replace('width="30" height="30"','width="17" height="17"')}</button></div>`;}).join('')}</div>`:''}
    <div style="height:40px"></div>`;
  showScreen('Result');
  const replayIds = (D.sourceIds&&D.sourceIds.length?D.sourceIds:D.ids).slice();
  const replayMode = mode;
  $('#againBtn').onclick=()=>{
    const onlyWrong = wrongIds.length && confirm('只重练本轮答错的 '+wrongIds.length+' 个单词吗？\n\n确定 = 只练错词\n取消 = 重练全部');
    startList(onlyWrong? wrongIds.slice() : replayIds, onlyWrong?'错词复习':name, replayMode, chapter);
  };
  if($('#seeWrong')) $('#seeWrong').onclick=()=>{ showScreen('Home'); renderHome('wrong'); };
  $('#homeBtn').onclick=()=>showScreen('Home');
  $$('#resultBody [data-play]').forEach(b=>b.onclick=()=>playWord(WORDS[+b.dataset.play]));
  D=null;
}

/* 会话保存/恢复 */
function saveSession(){
  if(!D) return;
  try{ localStorage.setItem(SS,JSON.stringify({ids:D.ids,sourceIds:D.sourceIds||D.ids,idx:D.idx,name:D.name,mode:D.mode,chapter:D.chapter,stats:D.stats,wrongSet:D.wrongSet})); }catch(e){}
}
function readSession(){ try{return JSON.parse(localStorage.getItem(SS)||'null');}catch(e){return null;} }
function resumeSession(){
  const s=readSession(); if(!s){ showToast('没有上次的进度', false); return; }
  D={ids:s.ids,sourceIds:s.sourceIds||s.ids,idx:Math.min(s.idx,s.ids.length-1),name:s.name,mode:s.mode,chapter:s.chapter,stats:s.stats,wrongSet:s.wrongSet||{},phase:'ask',locked:false,round:1,last:null};

}
/* 输入框镜像宽度 */
function updateMirror(){
  const inp=$('#typeIn'), m=$('#mirror');
  m.textContent=inp.value||'';
  const w=Math.max(150, m.offsetWidth+24);
  $('#rule').style.width=w+'px';
  $('#typeWrap').style.minWidth=w+'px';
  inp.style.width=w+'px';
  inp.style.padding='0';
}

<script>
/* =========================================================
   抽屉：设置 / 单词列表 / 模式菜单 / 帮助

function mask(html,maxw){
  const el=document.createElement('div');
  el.className='mask';
  el.innerHTML=`<div class="sheet" ${maxw?`style="max-width:${maxw}px"`:''}>${html}</div>`;
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.querySelectorAll('[data-x]').forEach(b=>{ if(!b.getAttribute('aria-label')) b.setAttribute('aria-label','关闭'); b.onclick=()=>el.remove(); });
  document.body.appendChild(el);
  return el;
}
function closeTop(){ const m=$$('.mask').pop(); if(m) m.remove(); }
/* ---------- 模式菜单 ---------- */
const MODE_LIST=[['smart','智能模式','系统自动混合三种题型'],['dictation','听写模式','听发音，写出单词'],['soundmean','听选释义','听发音，选出正确释义'],['wordmean','看词选义','看单词，选出正确释义'],['spell','看义写词','看中文，写出英文单词'],['walkman','随身听模式','自动循环朗读，闭眼磨耳朵']];
function openModeMenu(){

    <div class="body" style="padding-top:8px">
      ${MODE_LIST.map(([k,n,d])=>`<button type="button" class="rowset" style="width:100%;text-align:left;border:none;padding:12px 4px;border-radius:10px;justify-content:flex-start;gap:10px;align-items:flex-start" data-k="${k}">
        <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid ${S.set.mode===k?'var(--orange)':'var(--line)'};margin-top:3px;flex:0 0 auto;box-shadow:${S.set.mode===k?'inset 0 0 0 4px var(--orange)':'none'}"></span>
        <span><span style="font-size:15px;color:${S.set.mode===k?'var(--orange)':'var(--tx)'}">${n}</span><div class="sub">${d}</div></span></button>`).join('')}
    </div>`);
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    S.set.mode=b.dataset.k; save(); el.remove();

}
/* ---------- 单词列表抽屉 ---------- */
let listUnit=null;
function openWordList(unit){
  const practice=unit==null && D && !String(D.name||'').startsWith('list_');
  if(!practice) unit = unit || (D&&String(D.name||'').startsWith('list_')&&D.chapter) || S.set.chapter || 1;

    ${practice?'':`<div class="ft"><button class="btn" type="button" data-prev>上一页</button><span class="sub" id="wlPos">第 ${unit} 页 · ${ids.length} 词</span><button class="btn" type="button" data-next>下一页</button></div>`}`);

      <div class="m">${(w.senses||[{pos:w.pos,text:w.meaning}]).map(sn=>`<div><b style="font-weight:600">${esc(sn.pos||w.pos)}</b> ${esc(sn.text||'')}</div>`).join('')}</div>
      ${(w.exam&&w.exam.length)?`<div class="wlexam" style="margin-top:5px">${w.exam.map(e=>`<span>${esc(e)}</span>`).join('')}</div>`:''}
      <div class="syn">已练 ${p.ok||0} 次 · 熟练度 ${p.lv||0}/9${p.wrong?` · <span style="color:var(--wrong)">错过 ${p.wrong} 次</span>`:''}</div>
      <div class="tabsm"><button class="on" data-t="ex">例句</button><button data-t="en">英义</button><button data-t="syn">近义</button><button data-t="note">笔记</button></div>
      <div class="ex" data-panel="ex">${w.ex?hlWord(w.ex,w.word)+`<div class="cn">${esc(w.pos)} ${esc(w.meaning)}</div>`:'<span style="color:var(--tx3)">暂无例句</span>'}</div>
      <div class="tools">
        <button data-act="play" title="播放">${ICON.spk.replace('width="30" height="30"','width="17" height="17"')}</button>
        <button data-act="star" class="${p.star?'on':''}" title="收藏">${p.star?ICON.starOn:ICON.star}</button>
        ${practice||w.custom?'':`<button type="button" data-act="img" aria-label="看笔记原图" title="看笔记原图">${ICON.book}</button>`}
      </div>
    </div>`}).join('') || '<div class="emptybox">这一份里还没有单词</div>';
  const pageKeys=()=>Object.keys(units()).map(Number).sort((a,b)=>a-b);

      card.querySelectorAll('.tabsm button').forEach(x=>x.classList.toggle('on',x===b));

        : t==='en' ? (w.en_def? esc(w.en_def) : '<span style="color:var(--tx3)">暂无英文释义</span>')
        : t==='syn' ? (w.syn&&w.syn.length? w.syn.map(s=>`<span class="pill" style="margin:2px 4px 2px 0">${esc(s)}</span>`).join('') : '<span style="color:var(--tx3)">暂无近义词</span>')

      const act=b.dataset.act;
      if(act==='play') playWord(w);
      if(act==='star'){ const p=P(i); p.star=!p.star; if(p.star&&S.set.autoReviewCollect&&!p.due) p.due=Date.now(); save(); b.classList.toggle('on',p.star); }

}

/* ---------- 设置抽屉 ---------- */
function openSettings(){
  const el=mask(`<div class="sh"><h3>设置</h3><button class="icobtn" data-x>✕</button></div>
    <div class="tabrow" id="setTabs">
      <button class="on" data-t="ans">答题</button><button data-t="snd">声音</button>

    else if(tab==='snd') body.innerHTML =

<script>
/* =========================================================

  $('#btnList').onclick=()=>openWordList();
  $('#btnSet').onclick=openSettings;
  $('#btnHelp').onclick=openHelp;
  $('#btnHome').onclick=()=>{ cancelQuestion(); stopAudio(); D=null; showScreen('Home'); };
  $('#btnShare').onclick=shareSite;
  $('#btnReview').onclick=()=>{ const ids=dueList(); if(ids.length) startList(ids,'今日复习'); else showToast('今天没有到期的复习。听写之后会按记忆曲线安排。', false); };
  $('#hdrMode').onclick=e=>{ e.stopPropagation(); openModeMenu(); };
  $('#spkBtn').innerHTML=ICON.spk;
  $('#spkBtn').onclick=()=>{ if(D&&D.cur) playWord(curWord()); };
  $('#submitBtn').onclick=()=>{ if(!D) return; if(D.phase==='fix') fixSubmit(); else submitTyped(); };
  $$('#accentSeg [data-drill-acc]').forEach(b=>b.onclick=()=>{
    S.set.accent=b.dataset.drillAcc; save(); syncAccent();
    if(D&&D.cur&&D.cur.m!=='wordmean') playWord(curWord());
  });
  syncAccent();
  $('#backBtn').onclick=()=>prevWord();
  $('#typeIn').addEventListener('input',()=>{
    updateMirror(); sfx.key();
    if(S.set.autoSubmit && D && D.phase==='ask'){
      const v=$('#typeIn').value; if(norm(v)===norm(curWord().word)) submitTyped();
    }
  });
  $$('.tabs button').forEach(b=>b.onclick=()=>renderHome(b.dataset.tab));
  document.addEventListener('keydown',onKey);
  document.addEventListener('fullscreenchange',()=>{ if(backToSet) backToSet('dis'); });
}
function syncAccent(){
  $$('#accentSeg [data-drill-acc]').forEach(b=>b.classList.toggle('on', b.dataset.drillAcc===S.set.accent));
}
function prevWord(){
  if(!D) return;
  cancelQuestion();
  if(D.phase==='fix'){ D.phase='ask'; }
  if(D.idx>0){ D.idx--; D.last=null; nextQuestion(); }
  else { showToast('已经是第一个单词了'); }
}
function onKey(e){
  const typing=document.activeElement&&document.activeElement.id==='typeIn';
  const k=e.key, mod=e.ctrlKey||e.metaKey;
  if(k==='Escape'){ closeTop(); return; }
  if(!D || $('#scDrill').classList.contains('hide')) return;
  // 听选/看词选义：数字选项
  if(/^[1-5]$/.test(k) && D.opts && D.phase==='ask'){ const btn=$$('#opts .opt')[+k-1]; if(btn){ e.preventDefault(); btn.click(); } return; }
  if(k==='Tab'){ e.preventDefault(); playWord(curWord()); return; }
  if(k==='Enter'){
    e.preventDefault();
    if(D.phase==='fix') fixSubmit(); else submitTyped();
    return;
  }
  if(k==='ArrowUp'){ e.preventDefault(); prevWord(); return; }
  if(k==='ArrowDown' && D.mode==='walkman'){ e.preventDefault(); D.idx++; nextQuestion(); return; }
  if(mod&&k==='ArrowRight'){ e.preventDefault(); const i=D.cur.i,p=P(i); p.lv=9;p.ok++;p.due=Date.now()+EBB[8];save(); showToast('已标熟：'+WORDS[i].word); return; }
  if(mod&&(k==='l'||k==='L')){ e.preventDefault(); openWordList(); return; }
  if(mod&&(k==='q'||k==='Q')){ e.preventDefault(); const i=D.cur.i,p=P(i); p.star=!p.star; if(p.star&&S.set.autoReviewCollect&&!p.due)p.due=Date.now(); save(); showToast(p.star?'已收藏':'已取消收藏'); return; }
  if(mod&&(k==='y'||k==='Y')){ e.preventDefault(); S.set.showIpa=!S.set.showIpa; save(); renderLast(); showToast(S.set.showIpa?'显示音标':'隐藏音标'); return; }
  if(mod&&(k==='i'||k==='I')){ e.preventDefault(); S.set.showExample=!S.set.showExample; save(); renderLast(); showToast(S.set.showExample?'显示例句':'隐藏例句'); return; }
  if(e.altKey){ e.preventDefault(); const p=WORDS[D.cur.i]; if(p.ex) playExample(p); else showToast('这个单词暂无例句'); return; }
  if(k==='Shift'&&D.phase==='fix'){ D.phase='ask'; D.idx++; nextQuestion(); return; }
}
/* ---------- 启动 ---------- */
async function init(){
  load();
  await loadCustom();
  rebuildCustom();
  applyTheme();
  try{ notes=JSON.parse(localStorage.getItem(LS+'_notes')||'{}'); }catch(e){ notes={}; }
  if(speechOK){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  wire();
  showScreen('Home');
  if(location.hash==='#list') renderHome('list');
  if(!sessionStorage.getItem('autoTip')){ sessionStorage.setItem('autoTip','1'); }
  // 缺音频提醒
  setTimeout(()=>{ const probe=new Audio(audioSrc(WORDS[0],'us')); probe.onerror=()=>{ audioOK=false; }; },300);
}
document.addEventListener('DOMContentLoaded',init);

/* ---------- 修正补丁（保持逻辑集中） ---------- */
function renderQuestion(){
  const c=D.cur; if(!c) return;
  const w=c.w, m=c.m;
  const ipa=esc(S.set.accent==='us'?(w.ipa_us||''):(w.ipa_gb||''));
  let html='';
  if(m==='wordmean') html=`<div class="qword">${esc(w.word)}</div>`;
  else if(m==='spell') html=`<div class="qmean">${esc(w.pos)} ${esc(w.meaning)}</div>`;
  else if(m==='walkman') html=`<div class="qword">${esc(w.word)}</div><div class="qipa">${ipa}</div>
      <div class="qmean">${esc(w.pos)} ${esc(w.meaning)}</div>
      ${w.ex?`<div class="qex">${hlWord(w.ex,w.word)}</div>`:''}`;
  if(!html && S.set.showCorrectWord && (m==='dictation'||m==='soundmean'||m==='smart')){
    html=`<div class="qword" style="color:var(--tx3)">${esc(w.word)}</div>`;
  }
  if(!html && (S.set.showIpa||S.set.showMeaning) && m!=='wordmean' && m!=='walkman' && m!=='spell'){
    html=`<div class="qipa">${S.set.showIpa?ipa:''}</div><div class="qmean" style="font-size:18px">${S.set.showMeaning?esc(w.pos+' '+w.meaning):''}</div>`;
  }
  const qb=$('#qBox'); qb.innerHTML=html; qb.classList.toggle('hide',!html);
}
</script>
