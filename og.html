<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  background:linear-gradient(135deg,#fff6f1 0%,#ffffff 45%,#fff1ea 100%);position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.b1{width:520px;height:520px;background:#ffb08a;right:-120px;top:-140px}
.b2{width:420px;height:420px;background:#ffd9c7;left:-140px;bottom:-180px}
.inner{position:relative;height:100%;padding:78px 84px;display:flex;flex-direction:column}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:22px;color:#ff7a45;font-weight:700;letter-spacing:2px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff7a45}
h1{font-size:86px;line-height:1.1;margin-top:26px;letter-spacing:2px;color:#231f1c}
h1 span{color:#ff7a45}
p.sub{font-size:30px;color:#6b625c;margin-top:22px;line-height:1.5}
.chips{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.chip{font-size:23px;padding:10px 20px;border-radius:999px;background:#fff;border:1.5px solid #ffd7c6;color:#7a4a35}
.foot{position:absolute;left:84px;bottom:56px;font-size:22px;color:#9a908a;letter-spacing:.5px}
.icon{position:absolute;right:96px;bottom:74px;width:210px;height:210px;border-radius:46px;
  background:linear-gradient(135deg,#ff7a45,#ff9d6e);display:flex;align-items:center;justify-content:center;
  box-shadow:0 24px 60px rgba(255,122,69,.35)}
.icon svg{width:120px;height:120px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="inner">
  <div class="tag"><span class="dot"></span>SMART DICTATION</div>
  <h1>单词<span>听写</span></h1>
  <p class="sub">636 个单词 · 多种中文意思 · 美音英音双发音<br>听音写词、智能批改、错词本、记忆曲线</p>
  <div class="chips"><span class="chip">🎧 六种模式</span><span class="chip">✍️ 逐字母批改</span><span class="chip">🔊 点读连播</span></div>
</div>
<div class="foot">roubizhao6-sys.github.io/word-dictation</div>
<div class="icon"><svg viewBox="0 0 64 64"><path d="M16 14h26a7 7 0 017 7v30H23a7 7 0 01-7-7z" fill="#fff"/><path d="M24 25h16M24 33h16M24 41h10" stroke="#ff7a45" stroke-width="3.2" stroke-linecap="round"/></svg></div>
</body></html>
